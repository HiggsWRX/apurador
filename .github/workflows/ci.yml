name: CI

on:
  pull_request:
  push:
    branches: [main]
  # O agregado de pesquisas é o do dia em que o site é construído: um deploy logo depois da meia-noite de Brasília o
  # põe em dia mesmo sem pesquisa nova, e o das 23h05 de 24/10 põe no ar o agregado da noite, congelado às 23h.
  schedule:
    - cron: "5 3 * * *"
    - cron: "5 2 25 10 *"
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Todos os testes menos os do ensaio, que rodam ao lado, no job replay. Localmente, `npm test` roda tudo.
      - run: npx vitest run --project '!@apurador/ensaio'
      # Os totais de cada turno, no Brasil e em cada UF, contra os arquivos do TSE baixados agora.
      - run: npm run conferir
      # O código formatado pelo prettier (`npm run format`): só código; os dados, a calibração gerada e o markdown ficam de fora.
      - run: npx prettier --check "**/*.{ts,tsx,js,mjs,astro,css}"

  # O TSE falso e o replay automático: o coletor sobre a noite inteira do 2º turno de 2022, com e sem o cache da
  # borda do TSE (~2 min). Num job à parte, para o CI não somar o tempo dele ao dos outros testes.
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # O runner tem ~2 GB de heap por padrão, e o replay com quedas (`retomada.test.ts`) guarda duas noites inteiras
      # para compará-las: ~2,5 GB, medido com `--logHeapUsage` em 26/10. Dois workers com 3 GB cabem nos 7 GB do runner.
      - run: npx vitest run --project @apurador/ensaio
        env:
          NODE_OPTIONS: --max-old-space-size=3072
      # A calibração gerada de novo (~1 min) tem de sair igual à do repositório: uma mudança no modelo que mexa nos
      # números do registro ou dos CSVs falha aqui, e não na página de metodologia.
      - run: npm run calibracao
      - run: git diff --exit-code docs/calibracao.md docs/calibracao/

  deploy:
    needs: [testes, replay]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Os dois secrets são gravados pelo dono no GitHub. Sem eles, o deploy pula com aviso.
      - name: Conferir os secrets da Cloudflare
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Sem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório: o deploy pulou."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy
        env:
          PUBLIC_AO_VIVO: https://ao-vivo.apurador.org/
          PUBLIC_AO_VIVO_PLANO_B: https://apurador-plano-b.hicampos93.workers.dev/
