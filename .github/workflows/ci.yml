name: CI

on:
  pull_request:
  push:
    branches: [main]
  # O agregado de pesquisas é o do dia em que o site é construído: um deploy logo depois da meia-noite de Brasília o
  # põe em dia mesmo sem pesquisa nova, e o das 23h05 de 24/10 põe no ar o agregado da noite, congelado às 23h.
  schedule:
    - cron: "5 3 * * *"
    - cron: "5 2 25 10 *"
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Inclui o replay automático: o coletor sobre o TSE falso, a noite inteira do 2º turno de 2022
      # (packages/ensaio/test/replay.test.ts, ~1 min).
      - run: npm test
      # Os totais de cada turno, no Brasil e em cada UF, contra os arquivos do TSE baixados agora.
      - run: npm run conferir

  deploy:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Os dois secrets são gravados pelo dono no GitHub. Sem eles, o deploy pula com aviso.
      - name: Conferir os secrets da Cloudflare
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Sem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório: o deploy pulou."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy
